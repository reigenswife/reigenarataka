<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reigen 周边收藏</title>
    <style>
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #f8f7f4, #f0e9ff);
            color: #222;
            margin: 0;
            padding: 40px 20px;
        }
        h1 {
            text-align: center;
            color: #4a2c7d;
            margin-bottom: 40px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .item {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            text-align: center;
            padding-bottom: 15px;
        }
        .item img {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }
        .item p {
            margin: 15px 10px;
            font-size: 1.1em;
            color: #444;
        }
    </style>
</head>
<body>
    <h1>Reigen Arataka 周边收藏</h1>
    
    <div class="grid">
        <div class="item">
            <img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_20241215170218.jpg" alt="周边1">
            <p>灵能师手办</p>
        </div>
        <div class="item">
            <img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_202412151702181.jpg" alt="周边2">
            <p>Reigen 亚克力立牌</p>
        </div>
        <div class="item">
            <img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_20241215170204.jpg" alt="周边3">
            <p>灵能事务所钥匙扣</p>
        </div>
        <!-- 可以继续添加更多卡片 -->
    </div>

    <p style="text-align: center; margin-top: 60px;">
        <a href="index.html" style="color: #b38eff; text-decoration: none;">← 返回首页</a>
    </p>
</body>
</html>
