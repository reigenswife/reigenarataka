<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周边收藏 - Reigen Arataka</title>
    <style>
        body {
            font-family: "Microsoft YaHei", serif;
            background: linear-gradient(135deg, #1a1428, #2c1f4a, #1a1428);
            color: #e0d4ff;
            text-align: center;
            padding: 60px 20px;
            margin: 0;
        }
        h1 { color: #d4a5ff; font-size: 3.2em; margin-bottom: 10px; }
        .subtitle { color: #bb9eff; font-size: 1.5em; margin-bottom: 50px; }
        .back { color: #ffd700; text-decoration: none; font-size: 1.3em; margin-bottom: 40px; display: inline-block; }
        .merch-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .merch-item {
            background: rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 20px;
            transition: all 0.3s;
        }
        .merch-item:hover { transform: translateY(-8px); }
        img { width: 100%; border-radius: 15px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <a href="index.html" class="back">← 返回首页</a>
    <h1>周边收藏</h1>
    <p class="subtitle">灵能事务所精选周边</p>

    <div class="merch-grid">
        <div class="merch-item">
            <img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_20241215170204.jpg" alt="Reigen">
            <h3>灵能师珍藏立牌</h3>
        </div>
        <div class="merch-item">
            <img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_20241215170218.jpg" alt="Reigen">
            <h3>经典西装造型</h3>
        </div>
        <div class="merch-item">
            <img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_202412151702181.jpg" alt="Reigen">
            <h3>限量纪念版</h3>
        </div>
    </div>
</body>
</html>
