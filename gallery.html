<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reigen 画廊 - 图片 & 视频</title>
    <style>
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
        }
        h1 { color: #ffd700; font-size: 3em; margin-bottom: 10px; }
        .subtitle { color: #bb86fc; font-size: 1.5em; margin-bottom: 30px; }
        .back { color: #ffd700; text-decoration: none; font-size: 1.3em; display: inline-block; margin-bottom: 30px; }

        .carousel {
            max-width: 900px; 
            height: 580px;
            margin: 0 auto 30px;
            position: relative; 
            border-radius: 20px;
            overflow: hidden; 
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.4);
            background: #000;
        }

        .carousel-inner {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.95s ease-in-out;
        }

        .carousel-item {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .carousel-btn {
            position: absolute; 
            top: 50%; 
            transform: translateY(-50%);
            background: rgba(0,0,0,0.75); 
            color: white; 
            border: none;
            width: 60px; 
            height: 60px; 
            font-size: 30px; 
            cursor: pointer;
            border-radius: 50%; 
            z-index: 10;
            transition: all 0.3s;
        }
        .carousel-btn:hover {
            background: #ffd700;
            color: #000;
            transform: translateY(-50%) scale(1.1);
        }
        .prev { left: 20px; } 
        .next { right: 20px; }

        .carousel-indicators {
            position: absolute; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%);
            display: flex; 
            gap: 12px; 
            z-index: 10;
        }
        .indicator { 
            width: 14px; 
            height: 14px; 
            background: rgba(255,255,255,0.6); 
            border-radius: 50%; 
            cursor: pointer;
            transition: all 0.3s;
        }
        .indicator.active { 
            background: #ffd700; 
            transform: scale(1.4);
        }

        .music-control {
            margin: 15px auto;
            padding: 14px 32px;
            background: #bb86fc;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.15em;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        #lyrics {
            max-width: 920px;
            margin: 35px auto;
            height: 170px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.45em;
            line-height: 1.65;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            font-weight: bold;
        }
        .lyric-en { margin-bottom: 8px; opacity: 0.95; }
        .lyric-zh { font-size: 1.05em; opacity: 0.85; }
    </style>
</head>
<body>
    <a href="index.html" class="back">← 返回首页</a>
    <h1>Reigen Arataka 画廊</h1>
    <p class="subtitle">灵能师的精彩瞬间</p>

    <div class="carousel" id="carousel">
        <div class="carousel-inner" id="carouselInner"></div>
        <button class="carousel-btn prev" onclick="prevSlide()">‹</button>
        <button class="carousel-btn next" onclick="nextSlide()">›</button>
        <div class="carousel-indicators" id="indicators"></div>
    </div>

    <button class="music-control" id="musicBtn" onclick="toggleMusic()">
        🎵 播放背景音乐
    </button>

    <div id="lyrics">准备播放音乐...</div>

    <audio id="bgm" loop preload="auto">
        <source src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/M500004QiRC30LMa8u.mp3" type="audio/mpeg">
    </audio>

    <div style="max-width:900px;margin:50px auto;">
        <iframe width="100%" height="480" src="https://www.youtube.com/embed/9EPXegPw_Y4" frameborder="0" allowfullscreen></iframe>
    </div>

    <p style="margin-top: 80px; opacity: 0.7;">
        My favorite character website<br>
        Powered by GitHub Pages
    </p>

    <script>
        const carouselInner = document.getElementById('carouselInner');
        let currentIndex = 1;
        let isPlaying = false;
        const audio = document.getElementById('bgm');
        const musicBtn = document.getElementById('musicBtn');
        const lyricsDiv = document.getElementById('lyrics');

        const images = [
            "https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_20241215170218.jpg",
            "https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_202412151702181.jpg",
            "https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_20241215170204.jpg"
        ];

        // 初始化无限循环轮播
        function initCarousel() {
            carouselInner.innerHTML = '';

            // 最后一张（用于向左循环）
            const last = document.createElement('div');
            last.className = 'carousel-item';
            last.innerHTML = `<img src="${images[images.length-1]}" alt="Reigen">`;
            carouselInner.appendChild(last);

            // 正常图片
            images.forEach(src => {
                const item = document.createElement('div');
                item.className = 'carousel-item';
                item.innerHTML = `<img src="${src}" alt="Reigen">`;
                carouselInner.appendChild(item);
            });

            // 第一张（用于向右循环）
            const first = document.createElement('div');
            first.className = 'carousel-item';
            first.innerHTML = `<img src="${images[0]}" alt="Reigen">`;
            carouselInner.appendChild(first);
        }

        function updateIndicators() {
            const container = document.getElementById('indicators');
            container.innerHTML = '';
            images.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.classList.add('indicator');
                if (i === (currentIndex - 1) % images.length) dot.classList.add('active');
                dot.onclick = () => goToSlide(i);
                container.appendChild(dot);
            });
        }

        function showSlide(transition = true) {
            if (!transition) carouselInner.style.transition = 'none';
            carouselInner.style.transform = `translateX(-${currentIndex * 100}%)`;
            if (!transition) setTimeout(() => carouselInner.style.transition = 'transform 0.95s ease-in-out', 50);
            updateIndicators();
        }

        function nextSlide() {
            currentIndex++;
            showSlide();
            if (currentIndex >= images.length + 1) {
                setTimeout(() => {
                    currentIndex = 1;
                    showSlide(false);
                }, 950);
            }
        }

        function prevSlide() {
            currentIndex--;
            showSlide();
            if (currentIndex <= 0) {
                setTimeout(() => {
                    currentIndex = images.length;
                    showSlide(false);
                }, 950);
            }
        }

        function goToSlide(index) {
            currentIndex = index + 1;
            showSlide();
        }

        // ==================== 歌词部分 ====================
        const lyrics = [
            {time: 4.06, text: "Oh-ooh-ooh"},
            {time: 11.11, text: "Oh"},
            {time: 13.71, text: "Oh, oh-ooh"},
            {time: 17.42, text: "Sweet love, yeah"},
            {time: 21.56, text: "I didn't mean it when I said I didn't love you so"},
            {time: 25.05, text: "I should have held on tight, I never shoulda let you go"},
            {time: 28.52, text: "I didn't know nothin', I was stupid, I was foolish"},
            {time: 31.31, text: "I was lyin' to myself"},
            {time: 35.30, text: "I could not fathom that I would ever be without your love"},
            {time: 38.75, text: "Never imagined I'd be sittin' here beside myself"},
            {time: 42.22, text: "'Cause I didn't know you, 'cause I didn't know me, but I thought I knew everything"},
            {time: 49.01, text: "The feelin' that I'm feelin' now that I don't hear your voice"},
            {time: 52.52, text: "Or have your touch and kiss your lips 'cause I don't have a choice"},
            {time: 55.94, text: "Oh, what I wouldn't give to have you lyin' by my side"},
            {time: 59.09, text: "Right here, 'cause, baby"},
            {time: 62.57, text: "When you left, I lost a part of me"},
            {time: 66.81, text: "It's still so hard to believe"},
            {time: 70.32, text: "Come back, baby, please"},
            {time: 72.40, text: "'Cause we belong together"},
            {time: 75.16, text: "Who else am I gon' lean on when times get rough?"},
            {time: 78.58, text: "Who's gonna talk to me on the phone till the sun comes up?"},
            {time: 82.13, text: "Who's gonna take your place? There ain't nobody better"},
            {time: 85.28, text: "Oh, baby, baby, we belong together"},
            {time: 89.56, text: "I can't sleep at night, when you are on my mind"},
            {time: 93.14, text: "Bobby Womack's on the radio"},
            {time: 98.98, text: "Wait a minute, this is too deep"},
            {time: 106.91, text: "I only think of you"},
            {time: 109.41, text: "And it's breakin' my heart"},
            {time: 113.32, text: "I'm tryna keep it together, but I'm fallin' apart"},
            {time: 119.17, text: "Throwin' things, cryin'"},
            {time: 122.95, text: "The pain reflected in this song"},
            {time: 127.08, text: "I need ya, need ya back in my life, baby"},
            {time: 142.82, text: "Baby, when you left, I lost a part of me"},
            {time: 146.26, text: "Come back baby, please"},
            {time: 151.43, text: "Oh, baby, baby, we belong together"}
        ];

        const zhLyrics = {
            17.42: "甜蜜的爱",
            21.56: "我并非本意 说自己不爱你",
            25.05: "我应该好好抓紧你 不放开手让你走",
            28.52: "我却什么都没有做 愚蠢之极",
            31.31: "后悔莫及 自欺欺人",
            35.30: "我未料想过 没有你的爱我会怎么样",
            38.75: "也没设想过没有你 自己将会如此孑然一身",
            42.22: "都怪我没懂你 更不懂我自己 以为我自己明白一切",
            49.01: "所有曾经那各种缠绵 现在一切已化为乌有",
            52.52: "再也感受不到你的爱抚和亲吻 可我已别无选择",
            55.94: "我愿奋不顾身 去换取让你重回到我的身边",
            59.09: "就我身边 因为我们注定属于彼此",
            62.57: "当你离开我的时候我失魂落魄",
            66.81: "这一切仍难以让人想象",
            70.32: "求求你回到我身边吧",
            72.40: "因为我们注定属于彼此",
            75.16: "当我哀痛欲绝的时候 有谁能让我偎依在他身旁？",
            78.58: "谁又能和我打着电话 听我诉苦直到天亮？",
            82.13: "谁又能取代这世界上仅存完美的你 根本别无他人",
            85.28: "亲爱的 因为我们注定属于彼此",
            89.56: "我彻夜难眠 满脑海全是你的存在",
            98.98: "等等 这太让人压抑抓狂了",
            106.91: "我满脑海全是你",
            109.41: "内心独自承受着剧烈的支离破碎",
            113.32: "但我却彻底陷入了崩溃",
            127.08: "我现在立刻需要你重回到我身边",
            142.82: "当你离去之时我魂不守舍",
            146.26: "拜托你回到我身边吧",
            151.43: "因为宝贝我们注定属于彼此~~~"
        };

        function updateLyrics() {
            const currentTime = audio.currentTime;
            let enText = "♪ We Belong Together ♪";
            let zhText = "";

            for (let i = lyrics.length - 1; i >= 0; i--) {
                if (currentTime >= lyrics[i].time) {
                    enText = lyrics[i].text;
                    zhText = zhLyrics[lyrics[i].time] || "";
                    break;
                }
            }

            lyricsDiv.innerHTML = `
                <div class="lyric-en">${enText}</div>
                ${zhText ? `<div class="lyric-zh">${zhText}</div>` : ''}
            `;
        }

        function toggleMusic() {
            if (isPlaying) {
                audio.pause();
                musicBtn.innerHTML = "🎵 播放背景音乐";
            } else {
                audio.play().then(() => {
                    musicBtn.innerHTML = "⏸️ 暂停背景音乐";
                }).catch(() => alert("播放失败，请刷新页面后重试"));
            }
            isPlaying = !isPlaying;
        }

        window.onload = () => {
            initCarousel();
            showSlide();
            updateIndicators();
            audio.volume = 1.0;
            audio.addEventListener('timeupdate', updateLyrics);
        };

        document.addEventListener('keydown', e => {
            if (e.key === "ArrowRight") nextSlide();
            if (e.key === "ArrowLeft") prevSlide();
        });
    </script>
</body>
</html>
