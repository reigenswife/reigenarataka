<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reigen 画廊 - 图片 & 视频</title>
    <style>
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
        }
        h1 {
            color: #ffd700;
            font-size: 3em;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #bb86fc;
            font-size: 1.5em;
            margin-bottom: 50px;
        }
        .back {
            color: #ffd700;
            text-decoration: none;
            font-size: 1.3em;
            display: inline-block;
            margin-bottom: 30px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .gallery-item {
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
            transition: transform 0.3s;
        }
        .gallery-item:hover {
            transform: scale(1.05);
        }
        .gallery-item img, .gallery-item iframe {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none;
        }
        .gallery-item iframe {
            height: 300px;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back">← 返回首页</a>
    <h1>Reigen Arataka 画廊</h1>
    <p class="subtitle">灵能师的精彩瞬间</p>

    <div class="gallery">
        
        <!-- 图片1 -->
        <div class="gallery-item">
            <img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_20241215170218.jpg" alt="Reigen 1">
        </div>

        <!-- 你可以继续在这里复制添加更多图片 -->
        <!-- <div class="gallery-item">
            <img src="你的图片链接" alt="Reigen 2">
        </div> -->

        <!-- 视频 -->
        <div class="gallery-item">
            <iframe src="https://www.youtube.com/embed/9EPXegPw_Y4" 
                    title="Reigen Video" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen></iframe>
        </div>

    </div>

    <p style="margin-top: 80px; opacity: 0.7;">
        My favorite character website<br>
        Powered by GitHub Pages
    </p>
</body>
</html>
