<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reigen 画廊 - 图片 & 视频</title>
    <style>
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
        }
        h1 { color: #ffd700; font-size: 3em; margin-bottom: 10px; }
        .subtitle { color: #bb86fc; font-size: 1.5em; margin-bottom: 30px; }
        .back { color: #ffd700; text-decoration: none; font-size: 1.3em; display: inline-block; margin-bottom: 30px; }

        .carousel {
            max-width: 900px;
            height: 580px;
            margin: 0 auto 40px;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.4);
            background: #000;
        }

        .carousel-inner { display: flex; width: 100%; height: 100%; transition: transform 0.6s ease; }
        .carousel-item { min-width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
        .carousel-item img { width: 100%; height: 100%; object-fit: cover; object-position: center; }

        .carousel-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.75); color: white; border: none;
            width: 60px; height: 60px; font-size: 30px; cursor: pointer;
            border-radius: 50%; z-index: 10;
        }
        .prev { left: 20px; }
        .next { right: 20px; }

        .carousel-indicators {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 12px; z-index: 10;
        }
        .indicator {
            width: 14px; height: 14px; background: rgba(255,255,255,0.6);
            border-radius: 50%; cursor: pointer;
        }
        .indicator.active { background: #ffd700; transform: scale(1.3); }

        .music-control {
            margin: 20px auto;
            padding: 14px 32px;
            background: #bb86fc;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.15em;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .music-control:hover { background: #ffd700; color: #000; }
    </style>
</head>
<body>
    <a href="index.html" class="back">← 返回首页</a>
    <h1>Reigen Arataka 画廊</h1>
    <p class="subtitle">灵能师的精彩瞬间</p>

    <div class="carousel" id="carousel">
        <div class="carousel-inner" id="carouselInner">
            <div class="carousel-item"><img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_20241215170218.jpg" alt="Reigen 1"></div>
            <div class="carousel-item"><img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_202412151702181.jpg" alt="Reigen 2"></div>
            <div class="carousel-item"><img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_20241215170204.jpg" alt="Reigen 3"></div>
        </div>
        <button class="carousel-btn prev" onclick="prevSlide()">‹</button>
        <button class="carousel-btn next" onclick="nextSlide()">›</button>
        <div class="carousel-indicators" id="indicators"></div>
    </div>

    <button class="music-control" id="musicBtn" onclick="toggleMusic()">
        🎵 播放背景音乐
    </button>

    <audio id="bgm" loop preload="auto">
        <source src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/M500004QiRC30LMa8u.mp3" type="audio/mpeg">
    </audio>

    <div style="max-width:900px;margin:50px auto;">
        <iframe width="100%" height="480" src="https://www.youtube.com/embed/9EPXegPw_Y4" frameborder="0" allowfullscreen></iframe>
    </div>

    <p style="margin-top: 80px; opacity: 0.7;">
        My favorite character website<br>
        Powered by GitHub Pages
    </p>

    <script>
        let currentIndex = 0;
        let isPlaying = false;
        const audio = document.getElementById('bgm');
        const musicBtn = document.getElementById('musicBtn');

        function updateIndicators() {
            const slides = document.querySelectorAll('.carousel-item');
            const container = document.getElementById('indicators');
            container.innerHTML = '';
            slides.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.classList.add('indicator');
                if (i === currentIndex) dot.classList.add('active');
                dot.onclick = () => goToSlide(i);
                container.appendChild(dot);
            });
        }

        function showSlide(index) {
            const total = document.querySelectorAll('.carousel-item').length;
            currentIndex = (index + total) % total;
            document.getElementById('carouselInner').style.transform = `translateX(-${currentIndex * 100}%)`;
            updateIndicators();
        }

        function nextSlide() { showSlide(currentIndex + 1); }
        function prevSlide() { showSlide(currentIndex - 1); }
        function goToSlide(index) { showSlide(index); }

        function toggleMusic() {
            if (isPlaying) {
                audio.pause();
                musicBtn.innerHTML = "🎵 播放背景音乐";
            } else {
                audio.play()
                    .then(() => {
                        musicBtn.innerHTML = "⏸️ 暂停背景音乐";
                    })
                    .catch(() => {
                        alert("播放失败，请刷新页面后重新点击");
                    });
            }
            isPlaying = !isPlaying;
        }

        window.onload = () => {
            updateIndicators();
            showSlide(0);
            audio.volume = 1.0;        // ← 已调至最大音量
        };

        document.addEventListener('keydown', e => {
            if (e.key === "ArrowRight") nextSlide();
            if (e.key === "ArrowLeft") prevSlide();
        });
    </script>
</body>
</html>
