<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reigen 画廊 - 图片 & 视频</title>
    <style>
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
        }
        h1 { color: #ffd700; font-size: 3em; margin-bottom: 10px; }
        .subtitle { color: #bb86fc; font-size: 1.5em; margin-bottom: 30px; }
        .back {
            color: #ffd700;
            text-decoration: none;
            font-size: 1.3em;
            display: inline-block;
            margin-bottom: 30px;
        }

        .carousel {
            max-width: 850px;
            margin: 0 auto 50px;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
        }

        .carousel-inner {
            display: flex;
            transition: transform 0.6s ease;
        }

        .carousel-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            width: 55px;
            height: 55px;
            font-size: 28px;
            cursor: pointer;
            border-radius: 50%;
            z-index: 10;
        }
        .prev { left: 15px; }
        .next { right: 15px; }

        .carousel-indicators {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .indicator {
            width: 13px;
            height: 13px;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
            cursor: pointer;
            transition: 0.3s;
        }
        .indicator.active {
            background: #ffd700;
            transform: scale(1.3);
        }

        /* 自动播放开关按钮 */
        .autoplay-toggle {
            margin: 20px auto;
            padding: 10px 25px;
            font-size: 1.1em;
            background: #bb86fc;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .autoplay-toggle:hover {
            background: #ffd700;
            color: #000;
        }

        .video-container {
            max-width: 850px;
            margin: 40px auto;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back">← 返回首页</a>
    <h1>Reigen Arataka 画廊</h1>
    <p class="subtitle">灵能师的精彩瞬间</p>

    <!-- 图片轮播 -->
    <div class="carousel" id="carousel">
        <div class="carousel-inner" id="carouselInner">
            <div class="carousel-item">
                <img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_20241215170218.jpg" alt="Reigen 1">
            </div>
            <div class="carousel-item">
                <img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_202412151702181.jpg" alt="Reigen 2">
            </div>
            <div class="carousel-item">
                <img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_20241215170204.jpg" alt="Reigen 3">
            </div>
        </div>

        <!-- 左右按钮 -->
        <button class="carousel-btn prev" onclick="prevSlide()">‹</button>
        <button class="carousel-btn next" onclick="nextSlide()">›</button>

        <!-- 指示器 -->
        <div class="carousel-indicators" id="indicators"></div>
    </div>

    <!-- 自动播放开关 -->
    <button class="autoplay-toggle" id="toggleBtn" onclick="toggleAutoplay()">
        ▶️ 自动播放已开启
    </button>

    <!-- 视频 -->
    <div class="video-container">
        <iframe width="100%" height="450" 
                src="https://www.youtube.com/embed/9EPXegPw_Y4"
                title="Reigen Video" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen></iframe>
    </div>

    <p style="margin-top: 80px; opacity: 0.7;">
        My favorite character website<br>
        Powered by GitHub Pages
    </p>

    <script>
        let currentIndex = 0;
        let autoplay = true;
        let autoplayInterval;

        const carouselInner = document.getElementById('carouselInner');
        const indicatorsContainer = document.getElementById('indicators');
        const toggleBtn = document.getElementById('toggleBtn');

        function updateIndicators() {
            const slides = document.querySelectorAll('.carousel-item');
            indicatorsContainer.innerHTML = '';
            
            slides.forEach((_, index) => {
                const dot = document.createElement('div');
                dot.classList.add('indicator');
                if (index === currentIndex) dot.classList.add('active');
                dot.onclick = () => goToSlide(index);
                indicatorsContainer.appendChild(dot);
            });
        }

        function showSlide(index) {
            const slides = document.querySelectorAll('.carousel-item');
            if (index >= slides.length) currentIndex = 0;
            if (index < 0) currentIndex = slides.length - 1;
            
            carouselInner.style.transform = `translateX(-${currentIndex * 100}%)`;
            updateIndicators();
        }

        function nextSlide() {
            currentIndex++;
            showSlide(currentIndex);
        }

        function prevSlide() {
            currentIndex--;
            showSlide(currentIndex);
        }

        function goToSlide(index) {
            currentIndex = index;
            showSlide(currentIndex);
        }

        // 自动播放控制
        function startAutoplay() {
            autoplayInterval = setInterval(() => {
                nextSlide();
            }, 3500);
        }

        function stopAutoplay() {
            clearInterval(autoplayInterval);
        }

        function toggleAutoplay() {
            autoplay = !autoplay;
            if (autoplay) {
                toggleBtn.textContent = "▶️ 自动播放已开启";
                toggleBtn.style.background = "#bb86fc";
                startAutoplay();
            } else {
                toggleBtn.textContent = "⏸️ 自动播放已关闭";
                toggleBtn.style.background = "#666";
                stopAutoplay();
            }
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (e.key === "ArrowRight") {
                nextSlide();
            } else if (e.key === "ArrowLeft") {
                prevSlide();
            }
        });

        // 鼠标悬停暂停
        const carousel = document.getElementById('carousel');
        carousel.addEventListener('mouseenter', () => {
            if (autoplay) stopAutoplay();
        });
        carousel.addEventListener('mouseleave', () => {
            if (autoplay) startAutoplay();
        });

        // 初始化
        window.onload = () => {
            updateIndicators();
            showSlide(0);
            startAutoplay();
        };
    </script>
</body>
</html>
