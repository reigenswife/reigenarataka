<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reigen 画廊 - 图片 & 视频</title>

<style>
body {
    font-family: "Microsoft YaHei", Arial, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #fff;
    text-align: center;
    padding: 40px 20px;
    margin: 0;
}

h1 { color: #ffd700; font-size: 3em; }
.subtitle { color: #bb86fc; font-size: 1.5em; }
.back { color: #ffd700; text-decoration: none; font-size: 1.3em; }

.carousel {
    max-width: 900px;
    height: 580px;
    margin: 30px auto;
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 0 35px rgba(255, 215, 0, 0.4);
}

.carousel-inner {
    display: flex;
    height: 100%;
    transition: transform 0.95s ease-in-out;
}

.carousel-item {
    min-width: 100%;
    height: 100%;
}

.carousel-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.carousel-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.7);
    color: white;
    border: none;
    width: 60px;
    height: 60px;
    font-size: 30px;
    cursor: pointer;
    border-radius: 50%;
}
.prev { left: 20px; }
.next { right: 20px; }

.music-control {
    margin: 20px;
    padding: 12px 30px;
    background: #bb86fc;
    border: none;
    border-radius: 30px;
    color: white;
    cursor: pointer;
}

#lyrics {
    margin: 20px;
    font-size: 1.3em;
}
</style>
</head>

<body>

<a href="index.html" class="back">← 返回首页</a>
<h1>Reigen Arataka 画廊</h1>
<p class="subtitle">灵能师的精彩瞬间</p>

<div class="carousel">
    <div class="carousel-inner" id="carouselInner">
        <div class="carousel-item"><img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_20241215170218.jpg"></div>
        <div class="carousel-item"><img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_202412151702181.jpg"></div>
        <div class="carousel-item"><img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_20241215170204.jpg"></div>
    </div>

    <button class="carousel-btn prev" onclick="prevSlide()">‹</button>
    <button class="carousel-btn next" onclick="nextSlide()">›</button>
</div>

<button class="music-control" onclick="toggleMusic()" id="musicBtn">
🎵 播放背景音乐
</button>

<div id="lyrics">♪ We Belong Together ♪</div>

<audio id="bgm" loop>
    <source src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/M500004QiRC30LMa8u.mp3">
</audio>

<script>
const carouselInner = document.getElementById('carouselInner');
let slides = document.querySelectorAll('.carousel-item');

// 克隆第一张
const firstClone = slides[0].cloneNode(true);
carouselInner.appendChild(firstClone);

slides = document.querySelectorAll('.carousel-item');

let currentIndex = 0;
let isPlaying = false;

const audio = document.getElementById('bgm');
const musicBtn = document.getElementById('musicBtn');
const lyricsDiv = document.getElementById('lyrics');

function nextSlide() {
    currentIndex++;
    carouselInner.style.transform = `translateX(-${currentIndex * 100}%)`;

    if (currentIndex === slides.length - 1) {
        setTimeout(() => {
            carouselInner.style.transition = "none";
            carouselInner.style.transform = "translateX(0)";
            currentIndex = 0;
        }, 950);

        setTimeout(() => {
            carouselInner.style.transition = "transform 0.95s ease-in-out";
        }, 1000);
    }
}

function prevSlide() {
    if (currentIndex === 0) {
        carouselInner.style.transition = "none";
        currentIndex = slides.length - 1;
        carouselInner.style.transform = `translateX(-${currentIndex * 100}%)`;

        setTimeout(() => {
            carouselInner.style.transition = "transform 0.95s ease-in-out";
            currentIndex--;
            carouselInner.style.transform = `translateX(-${currentIndex * 100}%)`;
        }, 20);
    } else {
        currentIndex--;
        carouselInner.style.transform = `translateX(-${currentIndex * 100}%)`;
    }
}

// 音乐
function toggleMusic() {
    if (isPlaying) {
        audio.pause();
        musicBtn.innerText = "🎵 播放背景音乐";
    } else {
        audio.play();
        musicBtn.innerText = "⏸️ 暂停背景音乐";
    }
    isPlaying = !isPlaying;
}

// 简单歌词
audio.addEventListener('timeupdate', () => {
    if (audio.currentTime > 60) {
        lyricsDiv.innerText = "Baby we belong together 💜";
    }
});
</script>

</body>
</html>
