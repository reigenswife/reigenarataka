<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
<title>gallery · Reigen Arataka</title>
<link rel="icon" type="image/png" sizes="96x96" href="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/favicon-96x96.png" />
<style>
  :root {
    --bg1: #dfe9f7;
    --bg2: #eef4fc;
    --frame: #bfd1e6;
    --frame-strong: #97b4d3;
    --panel: rgba(255,255,255,0.86);
    --text: #43566a;
    --muted: #76889d;
    --line: #d5e2f0;
    --accent2: #d9b7ea;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Maple Mono", "Consolas", "Courier New", "Microsoft YaHei", monospace;
    color: var(--text);
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.65), transparent 16%),
      radial-gradient(circle at 85% 16%, rgba(255,255,255,0.55), transparent 18%),
      linear-gradient(135deg, var(--bg1), var(--bg2));
    min-height: 100vh;
    padding: 48px 32px 64px;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #5b7ea3;
    text-decoration: none;
    font-size: 1rem;
    margin-bottom: 28px;
    border: 1px solid #c5d8ec;
    border-radius: 999px;
    padding: 8px 20px;
    background: rgba(255,255,255,0.7);
    box-shadow: 0 4px 10px rgba(120,145,180,0.08);
    transition: transform .2s ease;
  }
  .back-link:hover { transform: translateY(-2px); color: #8b6b9e; }

  .page-header {
    text-align: center;
    margin-bottom: 36px;
  }
  .page-header h1 {
    margin: 0 0 10px;
    font-size: 2.4rem;
    color: #52718e;
    letter-spacing: 2px;
  }
  .page-header p {
    margin: 0;
    color: var(--muted);
    font-size: 1.05rem;
  }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
  }
  .gallery-item {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    border: 2px solid var(--frame-strong);
    background: white;
    box-shadow: 5px 5px 18px rgba(0,0,0,0.06);
    cursor: pointer;
    aspect-ratio: 1 / 1;
  }
  .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .3s ease, filter .3s ease;
  }
  .gallery-item:hover img {
    transform: scale(1.06);
    filter: brightness(1.03) saturate(1.05);
  }
  .gallery-item .num {
    position: absolute;
    top: 8px;
    left: 10px;
    font-size: 0.75rem;
    color: white;
    background: rgba(80,100,130,0.55);
    padding: 3px 10px;
    border-radius: 999px;
    letter-spacing: 1px;
  }

  .footer-note {
    margin-top: 48px;
    text-align: center;
    font-size: 0.9rem;
    color: #7d98b5;
    border-top: 2px dotted #c7daee;
    padding-top: 28px;
    line-height: 1.9;
  }

  /* Lightbox */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(40,50,65,0.72);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 32px;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 90vw;
    max-height: 85vh;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .lightbox-close {
    position: absolute;
    top: 24px;
    right: 32px;
    color: white;
    font-size: 2rem;
    cursor: pointer;
    background: none;
    border: none;
    line-height: 1;
  }
  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.5);
    color: white;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    font-size: 1.4rem;
    cursor: pointer;
  }
  .lightbox-prev { left: 24px; }
  .lightbox-next { right: 24px; }

  @media (max-width: 900px) {
    .gallery-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 600px) {
    body { padding: 28px 16px 40px; }
    .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .page-header h1 { font-size: 1.8rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html" class="back-link">← 回到首页</a>

  <div class="page-header">
    <h1>📸 gallery / 完整相册</h1>
    <p>Reigen Arataka · 收藏截图与照片墙 · 点击图片可放大查看</p>
  </div>

  <div class="gallery-grid" id="galleryGrid">
    <!-- 图片由脚本自动生成 -->
  </div>

  <div class="footer-note">
    made with love ♡ Reigen personal archive
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev">‹</button>
  <img id="lightboxImg" src="" alt="preview">
  <button class="lightbox-nav lightbox-next" id="lightboxNext">›</button>
</div>

<script>
  const base = "https://raw.githubusercontent.com/reigenswife/reigenarataka/main/images/";
  const files = [
    "reigen-1.jpg","reigen-2.jpg","reigen-3.jpg","reigen-4.jpg",
    "reigen-5.jpg","reigen-6.jpg","reigen-7.jpg","reigen-8.jpg",
    "reigen-9.jpg","reigen-10.jpg","reigen-11.jpg","reigen-12.jpg",
    "reigen-13.jpg","reigen-14.jpg","reigen-15.jpg","reigen-16.png"
  ];
  const urls = files.map(f => base + f);

  const grid = document.getElementById('galleryGrid');
  urls.forEach((url, i) => {
    const item = document.createElement('div');
    item.className = 'gallery-item';
    item.innerHTML = `<span class="num">${String(i+1).padStart(2,'0')}</span><img src="${url}" alt="reigen ${i+1}" loading="lazy">`;
    item.addEventListener('click', () => openLightbox(i));
    grid.appendChild(item);
  });

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  let currentIndex = 0;

  function openLightbox(i) {
    currentIndex = i;
    lightboxImg.src = urls[currentIndex];
    lightbox.classList.add('open');
  }
  function closeLightbox() {
    lightbox.classList.remove('open');
  }
  function showNext() {
    currentIndex = (currentIndex + 1) % urls.length;
    lightboxImg.src = urls[currentIndex];
  }
  function showPrev() {
    currentIndex = (currentIndex - 1 + urls.length) % urls.length;
    lightboxImg.src = urls[currentIndex];
  }

  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.getElementById('lightboxNext').addEventListener('click', showNext);
  document.getElementById('lightboxPrev').addEventListener('click', showPrev);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') showNext();
    if (e.key === 'ArrowLeft') showPrev();
  });
</script>
</body>
</html>
