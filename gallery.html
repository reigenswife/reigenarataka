        function initCarousel() {
            carouselInner.innerHTML = '';
            let item = document.createElement('div'); item.className = 'carousel-item';
            item.innerHTML = `<img src="${images[images.length-1]}" alt="">`; carouselInner.appendChild(item);
            images.forEach(src => {
                item = document.createElement('div'); item.className = 'carousel-item';
                item.innerHTML = `<img src="${src}" alt="">`; carouselInner.appendChild(item);
            });
            item = document.createElement('div'); item.className = 'carousel-item';
            item.innerHTML = `<img src="${images[0]}" alt="">`; carouselInner.appendChild(item);
        }

        function showSlide(transition = true) {
            if (!transition) carouselInner.style.transition = 'none';
            carouselInner.style.transform = `translateX(-${currentIndex * 100}%)`;
            if (!transition) setTimeout(() => carouselInner.style.transition = 'transform 0.95s ease-in-out', 50);
            updateIndicators();
        }

        function nextSlide() { 
            currentIndex++; 
            showSlide(); 
            if (currentIndex >= images.length + 1) {
                setTimeout(() => { 
                    currentIndex = 1; 
                    showSlide(false); 
                }, 950);
            }
        }
        
        function prevSlide() { 
            currentIndex--; 
            showSlide(); 
            if (currentIndex <= 0) {
                setTimeout(() => { 
                    currentIndex = images.length; 
                    showSlide(false); 
                }, 950);
            }
        }

        function updateIndicators() {
            const container = document.getElementById('indicators');
            container.innerHTML = '';
            images.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.classList.add('indicator');
                let activeIndex = (currentIndex - 1 + images.length) % images.length;
                if (i === activeIndex) dot.classList.add('active');
                dot.onclick = () => { 
                    currentIndex = i + 1; 
                    showSlide(); 
                };
                container.appendChild(dot);
            });

        // 加载歌曲
        function loadSong(index) {
            const song = playlist[index];
            if (!song) return;
            
            audio.src = song.url;
            songTitleElem.textContent = song.title;
            songArtistElem.textContent = song.artist;
            
            if (isPlaying) {
                audio.play().catch(err => console.log("自动播放被阻止:", err));
            }
            
            // 重置歌词
            currentLyricIndex = -1;
            const lyricsDiv = document.getElementById('lyrics');
            lyricsDiv.innerHTML = '';
            
            if (!song.hasLyrics) {
                const noLyricMsg = document.createElement('div');
                noLyricMsg.className = 'lyric-line active';
                noLyricMsg.innerHTML = `<div class="lyric-en">♪ ${song.title} ♪</div><div class="lyric-zh">暂无歌词</div>`;
                lyricsDiv.appendChild(noLyricMsg);
            }
        }

        // 切换播放/暂停
        function togglePlayPause() {
            if (isPlaying) {
                audio.pause();
                playPauseBtn.textContent = '▶';
            } else {
                audio.play().catch(err => {
                    console.log("播放失败:", err);
                    alert("播放失败，请检查音乐链接是否有效");
                });
                playPauseBtn.textContent = '⏸';
            }
            isPlaying = !isPlaying;
        }

        // 下一首
        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % playlist.length;
            loadSong(currentSongIndex);
            if (isPlaying) {
                audio.play().catch(err => console.log("自动播放失败:", err));
            }
        }

        // 上一首
        function prevSong() {
            currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
            loadSong(currentSongIndex);
            if (isPlaying) {
                audio.play().catch(err => console.log("自动播放失败:", err));
            }
        }

            // 更新歌词显示（只有一个，正确的版本）
        function updateLyrics() {
            const currentSong = playlist[currentSongIndex];
            if (!currentSong.hasLyrics) return;
            
            // 根据歌曲选择对应的歌词数组
            let currentLyrics = [];
            if (currentSong.lyricType === "underneath_stars") {
                currentLyrics = lyricsUnderneathStars;
            } else if (currentSong.lyricType === "i_stay_in_love") {
                currentLyrics = lyricsIStayInLove;
            } else if (currentSong.lyricType === "dont_forget") {
                currentLyrics = lyricsDontForget;
            } else if (currentSong.lyricType === "come_to_me") {
                currentLyrics = lyricsComeToMe;
            } else {
                currentLyrics = lyrics;  // 默认是 We Belong Together 的歌词
            }
            
            const currentTime = audio.currentTime;
            let enText = "♪ " + currentSong.title + " ♪";
            let zhText = "";

            let newIndex = -1;
            for (let i = currentLyrics.length - 1; i >= 0; i--) {
                if (currentTime >= currentLyrics[i].time) {
                    newIndex = i;
                    enText = currentLyrics[i].text;
                    zhText = currentLyrics[i].zh || "";
                    break;
                }
            }

            if (newIndex === currentLyricIndex) return;
            currentLyricIndex = newIndex;

            const newLine = document.createElement('div');
            newLine.className = 'lyric-line';
            newLine.innerHTML = `
                <div class="lyric-en">${enText}</div>
                ${zhText ? `<div class="lyric-zh">${zhText}</div>` : ''}
            `;

            const lyricsDiv = document.getElementById('lyrics');
            lyricsDiv.innerHTML = '';
            lyricsDiv.appendChild(newLine);
            setTimeout(() => newLine.classList.add('active'), 50);
        }
                

        // 音量控制
        function setVolume(value) {
            audio.volume = value / 100;
            volumeSlider.value = value;
            if (value === 0) {
                volumeBtn.textContent = '🔇';
                isMuted = true;
            } else {
                volumeBtn.textContent = value > 50 ? '🔊' : '🔉';
                isMuted = false;
            }
        }

        function toggleMute() {
            if (isMuted) {
                setVolume(previousVolume);
            } else {
                previousVolume = audio.volume * 100;
                setVolume(0);
            }
        }

        // 事件监听
        function initPlayer() {
            playPauseBtn.onclick = togglePlayPause;
            prevBtn.onclick = prevSong;
            nextBtn.onclick = nextSong;
            volumeSlider.oninput = (e) => setVolume(parseInt(e.target.value));
            volumeBtn.onclick = toggleMute;
            
            audio.addEventListener('timeupdate', updateLyrics);
            audio.addEventListener('ended', nextSong);
            audio.addEventListener('play', () => {
                isPlaying = true;
                playPauseBtn.textContent = '⏸';
            });
            audio.addEventListener('pause', () => {
                isPlaying = false;
                playPauseBtn.textContent = '▶';
            });
            
            loadSong(0);
            setVolume(100);
        }

        window.onload = () => {
            initCarousel();
            showSlide();
            updateIndicators();
            initPlayer();
        };

        document.addEventListener('keydown', e => {
            if (e.key === "ArrowRight") nextSlide();
            if (e.key === "ArrowLeft") prevSlide();
            if (e.key === " ") {
                e.preventDefault();
                togglePlayPause();
            }
        });
    </script>
