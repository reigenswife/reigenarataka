<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
<title>gallery · Reigen Arataka</title>
<link rel="icon" type="image/png" sizes="96x96" href="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/favicon-96x96.png" />
<style>
  :root {
    --bg1: #dfe9f7;
    --bg2: #eef4fc;
    --frame: #bfd1e6;
    --frame-strong: #97b4d3;
    --panel: rgba(255,255,255,0.86);
    --text: #43566a;
    --muted: #76889d;
    --line: #d5e2f0;
    --accent2: #d9b7ea;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Maple Mono", "Consolas", "Courier New", "Microsoft YaHei", monospace;
    color: var(--text);
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.65), transparent 16%),
      radial-gradient(circle at 85% 16%, rgba(255,255,255,0.55), transparent 18%),
      linear-gradient(135deg, var(--bg1), var(--bg2));
    min-height: 100vh;
    padding: 48px 32px 64px;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #5b7ea3;
    text-decoration: none;
    font-size: 1rem;
    margin-bottom: 28px;
    border: 1px solid #c5d8ec;
    border-radius: 999px;
    padding: 8px 20px;
    background: rgba(255,255,255,0.7);
    box-shadow: 0 4px 10px rgba(120,145,180,0.08);
    transition: transform .2s ease;
  }
  .back-link:hover { transform: translateY(-2px); color: #8b6b9e; }

  .page-header {
    text-align: center;
    margin-bottom: 36px;
  }
  .page-header h1 {
    margin: 0 0 10px;
    font-size: 2.4rem;
    color: #52718e;
    letter-spacing: 2px;
  }
  .page-header p {
    margin: 0;
    color: var(--muted);
    font-size: 1.05rem;
  }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
  }
  .gallery-item {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    border: 2px solid var(--frame-strong);
    background: white;
    box-shadow: 5px 5px 18px rgba(0,0,0,0.06);
    cursor: pointer;
    aspect-ratio: 1 / 1;
  }
  .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .3s ease, filter .3s ease;
  }
  .gallery-item:hover img {
    transform: scale(1.06);
    filter: brightness(1.03) saturate(1.05);
  }

  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    margin-top: 48px;
  }
  .pagination-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border: 2px solid var(--frame-strong);
    background: rgba(255,255,255,0.8);
    color: var(--text);
    cursor: pointer;
    font-size: 1rem;
    transition: all .2s ease;
  }
  .pagination-btn:hover:not(:disabled) {
    background: #97b4d3;
    color: white;
    transform: translateY(-2px);
  }
  .pagination-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .pagination-info {
    color: var(--muted);
    font-size: 0.95rem;
    min-width: 120px;
    text-align: center;
  }

  .footer-note {
    margin-top: 48px;
    text-align: center;
    font-size: 0.9rem;
    color: #7d98b5;
    border-top: 2px dotted #c7daee;
    padding-top: 28px;
    line-height: 1.9;
  }

  /* Lightbox */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(40,50,65,0.72);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 32px;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 90vw;
    max-height: 85vh;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .lightbox-close {
    position: absolute;
    top: 24px;
    right: 32px;
    color: white;
    font-size: 2rem;
    cursor: pointer;
    background: none;
    border: none;
    line-height: 1;
  }
  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.5);
    color: white;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    font-size: 1.4rem;
    cursor: pointer;
  }
  .lightbox-prev { left: 24px; }
  .lightbox-next { right: 24px; }

  @media (max-width: 900px) {
    .gallery-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 600px) {
    body { padding: 28px 16px 40px; }
    .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .page-header h1 { font-size: 1.8rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html" class="back-link">← 回到首页</a>

  <div class="page-header">
    <h1>📸 gallery / 完整相册</h1>
    <p>Reigen Arataka · 收藏截图与照片墙 · 点击图片可放大查看</p>
  </div>

  <div class="gallery-grid" id="galleryGrid">
    <!-- 图片由脚本自动生成 -->
  </div>

  <div class="pagination">
    <button class="pagination-btn" id="prevBtn">‹</button>
    <span class="pagination-info"><span id="currentPage">1</span> / <span id="totalPages">1</span></span>
    <button class="pagination-btn" id="nextBtn">›</button>
  </div>

  <div class="footer-note">
    made with love ♡ Reigen personal archive
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev">‹</button>
  <img id="lightboxImg" src="" alt="preview">
  <button class="lightbox-nav lightbox-next" id="lightboxNext">›</button>
</div>

<script>
  const base = "https://raw.githubusercontent.com/reigenswife/reigenarataka/main/images/";
  
  // 所有图片列表
  const allFiles = [
    // 第一页 (1-16)
    "reigen-1.jpg","reigen-2.jpg","reigen-3.jpg","reigen-4.jpg",
    "reigen-5.jpg","reigen-6.jpg","reigen-7.jpg","reigen-8.jpg",
    "reigen-9.jpg","reigen-10.jpg","reigen-11.jpg","reigen-12.jpg",
    "reigen-13.jpg","reigen-14.jpg","reigen-15.jpg","reigen-16.png",
    
    // 第二页 - 在这里添加更多图片
    "reigen-1.jpg","reigen-2.jpg","reigen-3.jpg","reigen-4.jpg",
    "reigen-5.jpg","reigen-6.jpg","reigen-7.jpg","reigen-8.jpg",
    "reigen-9.jpg","reigen-10.jpg","reigen-11.jpg","reigen-12.jpg",
    "reigen-13.jpg","reigen-14.jpg","reigen-15.jpg","reigen-16.png"
  ];
  
  const allUrls = allFiles.map(f => base + f);
  const imagesPerPage = 16; // 每页显示16张（4x4）
  
  let currentPage = 1;
  const totalPages = Math.ceil(allUrls.length / imagesPerPage);
  
  const grid = document.getElementById('galleryGrid');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const currentPageSpan = document.getElementById('currentPage');
  const totalPagesSpan = document.getElementById('totalPages');
  
  totalPagesSpan.textContent = totalPages;

  function renderPage(pageNum) {
    // 清空网格
    grid.innerHTML = '';
    
    // 计算起始和结束索引
    const startIdx = (pageNum - 1) * imagesPerPage;
    const endIdx = Math.min(startIdx + imagesPerPage, allUrls.length);
    
    // 渲染该页的图片
    for (let i = startIdx; i < endIdx; i++) {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      item.innerHTML = `<img src="${allUrls[i]}" alt="reigen ${i+1}" loading="lazy">`;
      item.addEventListener('click', () => openLightbox(i));
      grid.appendChild(item);
    }
    
    // 更新页码显示
    currentPageSpan.textContent = pageNum;
    
    // 更新按钮状态
    prevBtn.disabled = pageNum === 1;
    nextBtn.disabled = pageNum === totalPages;
  }

  // 分页按钮事件
  prevBtn.addEventListener('click', () => {
    if (currentPage > 1) {
      currentPage--;
      renderPage(currentPage);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });

  nextBtn.addEventListener('click', () => {
    if (currentPage < totalPages) {
      currentPage++;
      renderPage(currentPage);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });

  // Lightbox 功能
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  let currentLightboxIndex = 0;

  function openLightbox(i) {
    currentLightboxIndex = i;
    lightboxImg.src = allUrls[currentLightboxIndex];
    lightbox.classList.add('open');
  }
  
  function closeLightbox() {
    lightbox.classList.remove('open');
  }
  
  function showNextLightbox() {
    currentLightboxIndex = (currentLightboxIndex + 1) % allUrls.length;
    lightboxImg.src = allUrls[currentLightboxIndex];
  }
  
  function showPrevLightbox() {
    currentLightboxIndex = (currentLightboxIndex - 1 + allUrls.length) % allUrls.length;
    lightboxImg.src = allUrls[currentLightboxIndex];
  }

  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.getElementById('lightboxNext').addEventListener('click', showNextLightbox);
  document.getElementById('lightboxPrev').addEventListener('click', showPrevLightbox);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  
  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') showNextLightbox();
    if (e.key === 'ArrowLeft') showPrevLightbox();
  });

  // 初始化页面
  renderPage(currentPage);
</script>
</body>
</html>
