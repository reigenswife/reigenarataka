<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Reigen Arataka · 个人收藏站 · 放大版</title>
  <style>
    :root {
      --bg1: #dfe9f7;
      --bg2: #eef4fc;
      --frame: #bfd1e6;
      --frame-strong: #97b4d3;
      --panel: rgba(255,255,255,0.86);
      --panel-soft: rgba(245,249,255,0.94);
      --text: #43566a;
      --muted: #76889d;
      --line: #d5e2f0;
      --accent: #8eb1d6;
      --accent2: #d9b7ea;
      --white: #ffffff;
      --paper: #fffdf8;
      --paper-shadow: rgba(110,130,160,0.12);
      --lace: rgba(255,255,255,0.72);
      --pink: #e8c9f4;
      --blue: #dcecff;
      --yellow: #fff8d8;
      --base-scale: 1.18;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: "Maple Mono", "Consolas", "Courier New", "Microsoft YaHei", monospace;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,0.65), transparent 16%),
        radial-gradient(circle at 85% 16%, rgba(255,255,255,0.55), transparent 18%),
        linear-gradient(rgba(255,255,255,0.15), rgba(255,255,255,0.15)),
        repeating-linear-gradient(to bottom, rgba(120,150,190,0.08) 0px, rgba(120,150,190,0.08) 1px, transparent 2px, transparent 4px),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      min-height: 100vh;
      padding: 36px 24px 52px;
      overflow-x: hidden;
      position: relative;
      font-size: calc(14px * var(--base-scale));
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(to right, rgba(170,190,220,0.14) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(170,190,220,0.14) 1px, transparent 1px);
      background-size: 42px 42px;
      opacity: 0.4;
      z-index: 0;
    }

    a { color: #5b7ea3; font-size: 1em; }
    a:hover { color: #8b6b9e; }

    ::selection { background: #e8c9f4; color: #45627e; }

    .float-deco,
    .float-sparkle,
    .hanging-tag {
      position: fixed;
      pointer-events: none;
      z-index: 7;
    }

    .float-deco {
      font-size: calc(18px * var(--base-scale));
      color: rgba(130,160,200,0.45);
      animation: drift 6s ease-in-out infinite;
    }
    .d1 { top: 80px; left: 60px; }
    .d2 { top: 170px; right: 90px; animation-delay: 1s; }
    .d3 { bottom: 130px; left: 110px; animation-delay: 2s; }
    .d4 { bottom: 190px; right: 130px; animation-delay: 3s; }

    @keyframes drift {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .hanging-tag { animation: sway 3s ease-in-out infinite; }
    .hanging-tag span {
      display: block;
      font-size: calc(22px * var(--base-scale));
      color: rgba(217,183,234,0.7);
      text-align: center;
      margin-bottom: 6px;
      animation: swing 2s ease-in-out infinite;
    }
    .tag-body {
      background: linear-gradient(135deg, #f5e6ff, #e6f3ff);
      border: 1.5px solid #d9b7ea;
      border-radius: 16px;
      padding: 8px 18px;
      font-size: calc(0.85rem * var(--base-scale));
      color: #8b6b9e;
      letter-spacing: 1px;
      box-shadow: 0 4px 12px rgba(217,183,234,0.2);
      white-space: nowrap;
    }
    .tag-1 { top: 110px; left: 50px; animation-delay: 0s; }
    .tag-2 { top: 370px; right: 50px; animation-delay: 1s; }
    .tag-3 { bottom: 330px; left: 65px; animation-delay: 2s; }

    @keyframes sway {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
    }
    @keyframes swing {
      0%, 100% { transform: rotateZ(0deg); }
      25% { transform: rotateZ(2deg); }
      75% { transform: rotateZ(-2deg); }
    }

    .float-sparkle {
      font-size: calc(20px * var(--base-scale));
      animation: twinkle 3s ease-in-out infinite, drift 8s ease-in-out infinite;
      text-shadow: 0 0 8px rgba(217,183,234,0.6);
      color: rgba(217,183,234,0.7);
    }
    .sparkle-1 { top: 230px; right: 80px; animation-delay: 0s; }
    .sparkle-2 { bottom: 400px; left: 45px; animation-delay: 0.6s; }
    .sparkle-3 { top: 580px; right: 100px; animation-delay: 1.2s; }
    .sparkle-4 { top: 320px; left: 30px; animation-delay: 1.8s; }
    .sparkle-5 { bottom: 220px; right: 60px; animation-delay: 2.4s; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .lace-shell {
      position: relative;
      max-width: 1480px;
      margin: 0 auto;
      padding: 24px;
      border-radius: 48px;
      background:
        radial-gradient(circle, var(--lace) 32%, transparent 34%) 0 0 / 26px 26px,
        radial-gradient(circle, rgba(230,238,250,0.85) 24%, transparent 26%) 13px 13px / 26px 26px,
        linear-gradient(rgba(255,255,255,0.35), rgba(255,255,255,0.35));
      box-shadow: 0 16px 36px rgba(120,140,170,0.12);
    }

    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 1450px;
      margin: 0 auto;
      background: rgba(255,255,255,0.36);
      border: 4px solid transparent;
      border-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><defs><pattern id="lace" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="6" r="2.5" fill="%23d6e3f2"/><circle cx="18" cy="12" r="2" fill="%23c8d8ea"/><circle cx="6" cy="12" r="2" fill="%23c8d8ea"/><circle cx="12" cy="18" r="2.5" fill="%23d6e3f2"/></pattern></defs><rect width="24" height="24" fill="url(%23lace)"/></svg>') 12 repeat;
      border-radius: 38px;
      padding: 24px;
      box-shadow:
        inset 0 0 26px rgba(255,255,255,0.9),
        inset 0 0 48px rgba(217,183,234,0.15),
        0 0 0 8px rgba(248,251,255,0.95),
        0 0 0 12px rgba(217,183,234,0.4),
        0 0 0 16px rgba(182,201,224,0.65),
        0 0 0 22px rgba(255,255,255,0.5),
        0 12px 38px rgba(92,114,145,0.12),
        0 24px 52px rgba(92,114,145,0.08),
        0 0 80px rgba(217,183,234,0.1);
      backdrop-filter: blur(4px);
    }

    .inner-frame {
      border: 2.5px dashed #c7d8ea;
      border-radius: 28px;
      padding: 24px;
      background: rgba(255,255,255,0.34);
      position: relative;
    }

    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      border: 2px solid var(--frame);
      background: white;
      box-shadow: inset 0 0 0 6px rgba(255,255,255,0.75);
      margin-bottom: 20px;
    }
    .hero img {
      width: 100%;
      height: 420px;
      object-fit: cover;
      display: block;
      filter: saturate(0.9) brightness(1.03);
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to top, rgba(70,90,110,0.38), transparent 55%),
        repeating-linear-gradient(to bottom, rgba(255,255,255,0.06) 0px, rgba(255,255,255,0.06) 1px, transparent 2px, transparent 5px);
      pointer-events: none;
    }
    .hero-title {
      position: absolute;
      left: 38px;
      bottom: 32px;
      color: white;
      z-index: 2;
      text-shadow: 0 3px 14px rgba(0,0,0,0.4);
    }
    .hero-title h1 {
      margin: 0;
      font-size: clamp(2.2rem, 5vw, 3rem);
      letter-spacing: 2px;
    }
    .hero-title p {
      margin: 8px 0 0;
      font-size: 1rem;
      opacity: 0.95;
    }

    .panel {
      background: var(--panel);
      border: 2px solid var(--frame);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 8px 18px rgba(110,130,160,0.08);
      margin-bottom: 18px;
    }
    .panel-header {
      background: linear-gradient(90deg, #dbe8f6, #eef5fc);
      padding: 12px 16px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #58708b;
      border-bottom: 1px solid #d5e2f0;
    }
    .panel-body { padding: 18px; }

    .reigen-layout {
      display: grid;
      grid-template-columns: 0.95fr 1.3fr;
      gap: 18px;
      align-items: stretch;
    }

    .reigen-image {
      overflow: hidden;
      border-radius: 22px;
      border: 2px solid #c8d8e9;
      background: rgba(255,255,255,0.9);
      box-shadow: inset 0 0 0 5px rgba(255,255,255,0.55);
      min-height: 320px;
    }

    .reigen-image img {
      width: 100%;
      height: 100%;
      min-height: 320px;
      object-fit: cover;
      display: block;
      filter: saturate(0.95) brightness(1.02);
    }

    .reigen-blank {
      background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(242,247,255,0.88));
      border: 2px solid #c8d8e9;
      border-radius: 22px;
      padding: 22px;
      box-shadow: inset 0 0 0 5px rgba(255,255,255,0.55);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }

    .reigen-blank h3 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: 2px;
      color: #5b7695;
    }

    .reigen-desc {
      margin: 0;
      color: #667d98;
      line-height: 1.8;
      font-size: 1rem;
    }

    .reigen-mini-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .reigen-mini-card {
      background: rgba(255,255,255,0.82);
      border: 1.5px dashed #cbd9e8;
      border-radius: 18px;
      padding: 14px;
      min-height: 110px;
    }

    .reigen-mini-card span {
      display: inline-block;
      margin-bottom: 8px;
      font-size: 0.88rem;
      color: #8b6b9e;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .reigen-mini-card p {
      margin: 0;
      color: #667d98;
      line-height: 1.65;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="float-deco d1">✦</div>
  <div class="float-deco d2">✦</div>
  <div class="float-deco d3">✦</div>
  <div class="float-deco d4">✦</div>

  <div class="float-sparkle sparkle-1">✧</div>
  <div class="float-sparkle sparkle-2">✧</div>
  <div class="float-sparkle sparkle-3">✧</div>
  <div class="float-sparkle sparkle-4">✧</div>
  <div class="float-sparkle sparkle-5">✧</div>

  <div class="hanging-tag tag-1">
    <span>✿</span>
    <div class="tag-body">personal collection</div>
  </div>
  <div class="hanging-tag tag-2">
    <span>✿</span>
    <div class="tag-body">soft archive</div>
  </div>
  <div class="hanging-tag tag-3">
    <span>✿</span>
    <div class="tag-body">reigen arataka</div>
  </div>

  <div class="lace-shell">
    <div class="wrapper">
      <div class="inner-frame">
        <div class="hero">
          <img src="YOUR_IMAGE_SRC_HERE" alt="Reigen Arataka" />
          <div class="hero-title">
            <h1>Reigen Arataka</h1>
            <p>个人收藏站 · 放大版</p>
          </div>
        </div>

        <div class="panel reigen-panel">
          <div class="panel-header">REIGEN ARATAKA</div>
          <div class="panel-body">
            <div class="reigen-layout">
              <div class="reigen-image">
                <img src="YOUR_IMAGE_SRC_HERE" alt="Reigen Arataka" />
              </div>

              <div class="reigen-blank">
                <h3>REIGEN ARATAKA</h3>
                <p class="reigen-desc">
                  这里是留白区域，可以放角色简介、收藏记录、站点说明，
                  或者你想展示的任意内容。
                </p>

                <div class="reigen-mini-grid">
                  <div class="reigen-mini-card">
                    <span>ABOUT</span>
                    <p>角色档案 / 简介 / 标签</p>
                  </div>
                  <div class="reigen-mini-card">
                    <span>NOTES</span>
                    <p>短句 / 引用 / 随手记录</p>
                  </div>
                  <div class="reigen-mini-card">
                    <span>LINKS</span>
                    <p>目录 / 跳转 / 外链</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
