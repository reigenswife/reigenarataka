<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reigen Arataka · 灵能事务所</title>
    <style>
        :root {
            --bg: #eef2fa;
            --border-light: #cdddec;
            --inner-bg: #ffffff;
            --accent: #8db5d6;
            --text-main: #3a4a5c;
            --text-soft: #6b7c8f;
        }
        
        * { box-sizing: border-box; }
        
        body {
            font-family: "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 40px 24px;
            background-image: 
                linear-gradient(#e3e9f2 1px, transparent 1px),
                linear-gradient(90deg, #e3e9f2 1px, transparent 1px);
            background-size: 40px 40px;
        }
        
        .container {
            max-width: 1580px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 220px 1fr 220px;   /* 左右对称 */
            gap: 30px;
        }
        
        /* 左右小图区域 */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }
        
        .photocard {
            background: white;
            border-radius: 20px;
            padding: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-light);
        }
        
        .photocard img {
            width: 100%;
            border-radius: 14px;
            height: 240px;
            object-fit: cover;
        }
        
        /* 右侧也放小图（对称） */
        .sidebar-right {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }
        
        /* 右侧主内容 */
        .main {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        .lace-wrapper {
            background: #ebf1f8;
            border-radius: 32px;
            padding: 16px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.06);
        }
        
        .inner-card {
            background: var(--inner-bg);
            border-radius: 26px;
            padding: 38px;
            border: 1px solid var(--border-light);
        }
        
        /* 大横图 */
        .hero {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.07);
        }
        
        .hero img {
            width: 100%;
            height: 420px;        /* 加大，更突出 */
            object-fit: cover;
        }
        
        .hero-title {
            position: absolute;
            bottom: 40px;
            left: 50px;
            color: white;
            font-size: 3.8em;
            font-weight: 700;
            text-shadow: 0 4px 25px rgba(0,0,0,0.65);
        }
        
        /* 功能卡片 - 重点加大 */
        .sections {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
        }
        
        .section {
            background: #f9fbfe;
            border: 1px solid #e0e8f0;
            border-radius: 22px;
            padding: 26px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            height: 100%;
        }
        
        .section:hover {
            transform: translateY(-6px);
            background: white;
            border-color: var(--accent);
            box-shadow: 0 14px 28px rgba(141, 181, 214, 0.2);
        }
        
        /* 调整卡片宽度（参考图风格） */
        .s1 { grid-column: span 4; }
        .s2 { grid-column: span 4; }
        .s3 { grid-column: span 4; }
        .s4 { grid-column: span 12; }
        
        .section h3 {
            margin: 0 0 10px 0;
            color: #3a5a7a;
            font-size: 1.15em;
            font-weight: 600;
        }
        
        .section p {
            margin: 0 0 14px 0;
            font-size: 0.88em;
            color: var(--text-soft);
            line-height: 1.45;
        }
        
        .counter {
            font-size: 0.82rem;
            background: #eef3fc;
            padding: 6px 14px;
            border-radius: 30px;
            color: #5a7d9e;
        }
        
        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
            }
            .sidebar, .sidebar-right {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- 左侧小图 -->
        <div class="sidebar">
            <div class="photocard"><img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_20241215170218.jpg" alt="Reigen"></div>
            <div class="photocard"><img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_202412151702181.jpg" alt="心动记忆"></div>
            <div class="photocard"><img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_20241215170204.jpg" alt="日常"></div>
        </div>
        
        <!-- 中间主内容 -->
        <div class="main">
            <div class="lace-wrapper">
                <div class="inner-card">
                    <!-- 大横图 -->
                    <div class="hero">
                        <img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_20241215170218.jpg" alt="Reigen Arataka">
                        <div class="hero-title">Reigen Arataka</div>
                    </div>
                    
                    <!-- 功能卡片 -->
                    <div class="sections">
                        <div class="section s1">
                            <h3>📸 相册</h3>
                            <p>精彩瞬间</p>
                            <div class="counter">✨ 24 张</div>
                        </div>
                        <div class="section s2">
                            <h3>💖 心动记忆</h3>
                            <p>重要时刻</p>
                            <div class="counter">❤️ 12 个</div>
                        </div>
                        <div class="section s3">
                            <h3>📖 灵能故事</h3>
                            <p>日常记录</p>
                            <div class="counter">📘 8 话</div>
                        </div>
                        
                        <div class="section s1">
                            <h3>💬 经典语录</h3>
                            <p>“我可是21世纪最强的灵能师”</p>
                            <div class="counter">🌟 15 句</div>
                        </div>
                        
                        <div class="section s2">
                            <h3>🛍️ 周边收藏</h3>
                            <p>Merch 展示</p>
                            <div class="counter">🎁 9 件</div>
                        </div>
                        <div class="section s3">
                            <h3>👤 关于 Reigen</h3>
                            <p>最强灵能师</p>
                            <div class="counter">⚡ 传说</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 右侧小图（对称） -->
        <div class="sidebar-right">
            <div class="photocard"><img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_20241215170218.jpg" alt="Reigen"></div>
            <div class="photocard"><img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_202412151702181.jpg" alt="心动记忆"></div>
            <div class="photocard"><img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_20241215170204.jpg" alt="日常"></div>
        </div>
    </div>
</body>
</html>
