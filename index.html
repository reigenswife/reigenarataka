<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reigen Arataka · 灵能事务所</title>
    <style>
        :root {
            --bg: #f8f7f4;
            --card: #ffffff;
            --text: #222222;
            --accent: #b38eff;
        }
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.7;
        }
        .header {
            text-align: center;
            margin-bottom: 60px;
        }
        .header h1 {
            font-size: 3.6em;
            color: #2c1f4a;
            margin: 0 0 12px 0;
            text-shadow: 0 4px 20px rgba(179, 142, 255, 0.25);
        }
        /* 删除了 .header p 的样式，因为不再使用副标题 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 28px;
            max-width: 1250px;
            margin: 0 auto;
        }
        .card {
            background: var(--card);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.4s ease;
            text-decoration: none;
            color: inherit;
        }
        .card:hover {
            transform: translateY(-15px);
            box-shadow: 0 25px 50px rgba(179, 142, 255, 0.25);
        }
        .card img {
            width: 100%;
            height: 230px;
            object-fit: cover;
        }
        .card-content {
            padding: 24px;
        }
        .card-title {
            font-size: 1.45em;
            margin: 0 0 10px 0;
            color: #2c1f4a;
            font-weight: bold;
        }
        .card-date {
            color: #666666;
            font-size: 0.95em;
            margin-bottom: 14px;
        }
        .card-keyline {
            color: #444444;
            font-size: 1.02em;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Reigen Arataka</h1>
        <!-- 副标题已删除 -->
    </div>

    <div class="grid">
        <!-- 灵能画廊 (链接有效) -->
        <a href="gallery.html" class="card">
            <img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_20241215170218.jpg" alt="画廊">
            <div class="card-content">
                <div class="card-title">灵能画廊</div>
                <div class="card-date">精彩瞬间</div>
                <div class="card-keyline">Reigen 最帅气的每一帧</div>
            </div>
        </a>

        <!-- 心动记忆 (链接有效) -->
        <a href="memory.html" class="card">
            <img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_202412151702181.jpg" alt="记忆">
            <div class="card-content">
                <div class="card-title">心动记忆</div>
                <div class="card-date">重要时刻</div>
                <div class="card-keyline">那些值得反复回味的瞬间</div>
            </div>
        </a>

        <!-- 灵能故事 (新链接) -->
        <a href="story.html" class="card">
            <img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_20241215170204.jpg" alt="故事">
            <div class="card-content">
                <div class="card-title">灵能故事</div>
                <div class="card-date">日常记录</div>
                <div class="card-keyline">事务所的奇妙日常</div>
            </div>
        </a>

        <!-- 经典语录 (新链接) -->
        <a href="quotes.html" class="card">
            <img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_20241215170218.jpg" alt="语录">
            <div class="card-content">
                <div class="card-title">经典语录</div>
                <div class="card-date">名场面</div>
                <div class="card-keyline">“我可是21世纪最强的灵能师”</div>
            </div>
        </a>

        <!-- 周边收藏 (新链接) -->
        <a href="merch.html" class="card">
            <img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_202412151702181.jpg" alt="周边">
            <div class="card-content">
                <div class="card-title">周边收藏</div>
                <div class="card-date">Merch</div>
                <div class="card-keyline">Reigen 的各种周边展示</div>
            </div>
        </a>

        <!-- 关于 Reigen (新链接) -->
        <a href="about.html" class="card">
            <img src="https://raw.githubusercontent.com/reigenswife/reigenarataka/main/_20241215170204.jpg" alt="关于">
            <div class="card-content">
                <div class="card-title">关于 Reigen</div>
                <div class="card-date">灵能事务所</div>
                <div class="card-keyline">关于这位最强灵能师的一切</div>
            </div>
        </a>
    </div>

    <p style="margin-top: 100px; color: #666; font-size: 1.1em; text-align: center;">
        Powered by GitHub Pages • Reigen Arataka Fan Site
    </p>
</body>
</html>
