<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 lonely archive radio · 灵能收藏电台</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none; /* 优雅的旧站氛围，不干扰拖拽 */
    }

    body {
      margin: 0;
      background: transparent;
      font-family: "Maple Mono", "Consolas", "Courier New", "Microsoft YaHei", monospace;
      overflow: hidden;
    }

    /* 播放器容器 — 完全透明背景，融入父页面风格 */
    .radio-module {
      width: 100%;
      background: transparent;
      backdrop-filter: blur(2px);
    }

    .music-player {
      background: rgba(255,255,255,0.68);
      border: 2px solid #b8cfe6;
      border-radius: 28px;
      padding: 20px 18px;
      text-align: center;
      box-shadow: inset 0 0 0 4px rgba(255,255,255,0.65), 0 12px 28px rgba(133,157,186,0.12);
      transition: all 0.2s ease;
      backdrop-filter: blur(4px);
    }

    .cassette {
      width: 200px;
      height: 100px;
      margin: 0 auto 14px;
      background: linear-gradient(145deg, #2a2a2a, #181818);
      border: 4px solid #d9b7ea;
      border-radius: 12px;
      position: relative;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    .tape {
      position: absolute;
      top: 24px; left: 32px; right: 32px;
      height: 46px;
      background: repeating-linear-gradient(90deg, #c0c0c0 0, #c0c0c0 8px, #5a5a5a 8px, #5a5a5a 16px);
      border: 2px solid #8b6b9e;
      border-radius: 4px;
    }
    .label {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: #fef3e2;
      color: #6a4e82;
      padding: 4px 14px;
      font-size: 0.7rem;
      border: 1px solid #d9b7ea;
      border-radius: 20px;
      font-weight: bold;
      white-space: nowrap;
      font-family: monospace;
      letter-spacing: 1px;
    }

    .now-playing {
      margin: 12px 0 8px;
      font-size: 1rem;
      color: #547493;
      font-weight: 500;
      background: rgba(255,250,240,0.7);
      display: inline-block;
      padding: 6px 18px;
      border-radius: 60px;
      backdrop-filter: blur(2px);
    }
    #song-title {
      font-weight: bold;
      color: #4e3b62;
    }
    #song-artist {
      color: #6f85a1;
      margin-left: 6px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin: 18px 0 12px;
    }
    .controls button {
      background: #d9b7ea;
      color: white;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 1.4rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .controls button:hover {
      background: #b290c5;
      transform: scale(1.02) translateY(-2px);
    }

    .progress-container {
      margin: 12px 0 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #progress {
      flex: 1;
      height: 5px;
      border-radius: 10px;
      -webkit-appearance: none;
      background: #cddef0;
      cursor: pointer;
    }
    #progress:focus {
      outline: none;
    }
    #progress::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #b290c5;
      border: 1px solid white;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      cursor: pointer;
    }

    .playlist select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #c7d8ec;
      border-radius: 40px;
      background: rgba(255,255,255,0.85);
      font-size: 0.85rem;
      font-family: inherit;
      color: #4d6b8a;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 6px;
    }
    .playlist select:hover {
      background: rgba(255,255,240,0.95);
      border-color: #d9b7ea;
    }

    .lyrics-panel {
      margin-top: 20px;
      padding: 16px 12px;
      background: rgba(245, 240, 255, 0.7);
      border-radius: 24px;
      border: 1px solid #e0cdf2;
      text-align: center;
      min-height: 110px;
      backdrop-filter: blur(3px);
      transition: all 0.2s;
    }
    .lyric-line-main {
      transition: opacity 0.3s ease;
    }
    .lyric-en-main {
      font-size: 1.1rem;
      font-weight: bold;
      color: #4a2c7d;
      margin-bottom: 8px;
      line-height: 1.4;
      letter-spacing: 0.3px;
    }
    .lyric-zh-main {
      font-size: 0.9rem;
      color: #6a4e82;
      line-height: 1.5;
    }

    /* 微小的适配 — iframe内完整显示 */
    @media (max-width: 560px) {
      .cassette { width: 170px; height: 88px; transform: scale(0.96); }
      .tape { top: 20px; left: 24px; right: 24px; height: 40px; }
      .label { font-size: 0.6rem; bottom: 6px; }
      .controls button { width: 42px; height: 42px; font-size: 1.2rem; }
      .lyric-en-main { font-size: 0.95rem; }
    }
  </style>
</head>
<body>
<div class="radio-module">
  <div class="music-player">
    <!-- 复古磁带装饰 -->
    <div class="cassette">
      <div class="tape"></div>
      <div class="label">REIGEN ARCHIVE • 旧梦磁带</div>
    </div>

    <div class="now-playing">
      🎧 <span id="song-title">We Belong Together</span> · <span id="song-artist">Mariah Carey</span>
    </div>

    <div class="controls">
      <button id="prev-btn" aria-label="上一首">⫻</button>
      <button id="play-pause-btn" aria-label="播放/暂停">▶</button>
      <button id="next-btn" aria-label="下一首">⫽</button>
    </div>

    <div class="progress-container">
      <input type="range" id="progress" value="0" min="0" max="100" step="0.1">
    </div>

    <div class="playlist">
      <select id="playlist-select"></select>
    </div>

    <div class="lyrics-panel" id="lyricsPanel">
      <div class="lyric-line-main">
        <div class="lyric-en-main">♪ 点击播放 ♪</div>
        <div class="lyric-zh-main">沉淀在旧网页里的旋律与独白</div>
      </div>
    </div>
  </div>
</div>

<script>
  // ============================================================
  // 完整歌曲库 + 精确歌词 (基于原站数据，独立维护在此模块中)
  // ============================================================
  const PLAYLIST_DATA = [
    { 
      title: "We Belong Together", 
      artist: "Mariah Carey", 
      src: "https://raw.githubusercontent.com/reigenswife/reigenarataka/main/M500004QiRC30LMa8u.mp3",
      lyrics: [
        { time: 4.06, en: "Oh-ooh-ooh", zh: "" }, { time: 11.11, en: "Oh", zh: "" }, { time: 13.71, en: "Oh, oh-ooh", zh: "" },
        { time: 17.42, en: "Sweet love, yeah", zh: "甜蜜的爱" }, { time: 21.56, en: "I didn't mean it when I said I didn't love you so", zh: "我并非本意 说自己不爱你" },
        { time: 25.05, en: "I should have held on tight, I never shoulda let you go", zh: "我应该好好抓紧你 不放开手让你走" },
        { time: 28.52, en: "I didn't know nothin', I was stupid, I was foolish", zh: "我却什么都没有做 愚蠢之极" },
        { time: 31.31, en: "I was lyin' to myself", zh: "后悔莫及 自欺欺人" }, { time: 35.30, en: "I could not fathom that I would ever be without your love", zh: "我未料想过 没有你的爱我会怎么样" },
        { time: 38.75, en: "Never imagined I'd be sittin' here beside myself", zh: "也没设想过没有你 自己将会如此孑然一身" },
        { time: 42.22, en: "'Cause I didn't know you, 'cause I didn't know me, but I thought I knew everything", zh: "都怪我没懂你 更不懂我自己 以为我自己明白一切" },
        { time: 45.42, en: "I never felt", zh: "却一直在自欺欺人" }, { time: 49.01, en: "The feelin' that I'm feelin' now that I don't hear your voice", zh: "所有曾经那各种缠绵 现在一切已化为乌有" },
        { time: 52.52, en: "Or have your touch and kiss your lips 'cause I don't have a choice", zh: "再也感受不到你的爱抚和亲吻 可我已别无选择" },
        { time: 55.94, en: "Oh, what I wouldn't give to have you lyin' by my side", zh: "我愿奋不顾身 去换取让你重回到我的身边" },
        { time: 59.09, en: "Right here, 'cause, baby (We belong together)", zh: "就我身边 因为我们注定属于彼此" },
        { time: 62.57, en: "When you left, I lost a part of me", zh: "当你离开我的时候我失魂落魄" }, { time: 66.81, en: "It's still so hard to believe", zh: "这一切仍难以让人想象" },
        { time: 70.32, en: "Come back, baby, please", zh: "求求你回到我身边吧" }, { time: 72.40, en: "'Cause we belong together", zh: "因为我们注定属于彼此" },
        { time: 75.16, en: "Who else am I gon' lean on when times get rough?", zh: "当我哀痛欲绝的时候 有谁能让我偎依在他身旁？" }
      ]
    },
    { 
      title: "Underneath the Stars", 
      artist: "Mariah Carey", 
      src: "https://raw.githubusercontent.com/reigenswife/reigenarataka/main/3594040289.mp3",
      lyrics: [
        { time: 4.45, en: "One summer night", zh: "一个夏日的夜晚" }, { time: 9.02, en: "We ran away for a while", zh: "我们一同跑开" },
        { time: 15.92, en: "Laughing we hurried beneath the sky", zh: "笑着 我们在天空下匆忙" }, { time: 21.20, en: "To an obscure place to hide", zh: "寻找一个安全的可以躲藏的地方" },
        { time: 25.00, en: "That no-one could find", zh: "没有人能够找到" }, { time: 26.93, en: "And we drifted to another state of mind", zh: "接着我们进入了另一种心境" },
        { time: 32.94, en: "And imagined I was yours and you were mine", zh: "想象我是你的你是我的" }, { time: 39.01, en: "As we lay upon the grass", zh: "我们躺在草地上" },
        { time: 41.22, en: "There in the dark", zh: "黑暗中" }, { time: 43.95, en: "Underneath the stars", zh: "我们沐浴璀璨星光" }
      ]
    },
    { 
      title: "I Stay In Love", 
      artist: "Mariah Carey", 
      src: "https://raw.githubusercontent.com/reigenswife/reigenarataka/main/i.stay.love.mp3",
      lyrics: [
        { time: 2.85, en: "Oh, ooh-ooh-ooh", zh: "" }, { time: 6.30, en: "Oh, ooh-ooh", zh: "" }, { time: 9.76, en: "Oh-oh, ooh-ooh-ooh", zh: "" },
        { time: 12.41, en: "Why do I stay, why do I stay in love? Ooh", zh: "为什么我还要留在爱情里？" },
        { time: 16.93, en: "Oh, ooh-ooh-ooh (Why do I stay)", zh: "为什么我还要留下" }, { time: 24.05, en: "Baby, I stay in love with you", zh: "宝贝，我依然深爱着你" }
      ]
    },
    { 
      title: "Don't Forget About Us", 
      artist: "Mariah Carey", 
      src: "https://raw.githubusercontent.com/reigenswife/reigenarataka/main/Don't.Forget.About.Us..mp3",
      lyrics: [
        { time: 2.60, en: "(Don't forget about us)", zh: "别将我们遗忘" }, { time: 4.10, en: "Don't baby, don't baby, don't let it go", zh: "亲爱的别放手 别让它溜走" },
        { time: 7.61, en: "No baby, no baby, no baby, no", zh: "不 宝贝 请不要这样" }, { time: 9.11, en: "(Don't forget about us)", zh: "别将我们遗忘" },
        { time: 10.87, en: "Don't baby, don't baby, don't let it go", zh: "亲爱的别放手 别让它溜走" }, { time: 13.37, en: "My baby boy", zh: "我的爱人啊" },
        { time: 17.13, en: "Just let it die with no goodbyes", zh: "任爱消逝无需告别" }, { time: 20.41, en: "Details don't matter, we both paid the price", zh: "细节已不重要 我们都付出代价" }
      ]
    },
    { 
      title: "Come To Me", 
      artist: "Mariah Carey", 
      src: "https://raw.githubusercontent.com/reigenswife/reigenarataka/main/come.buck.to.me.mp3",
      lyrics: [
        { time: 10.67, en: "The rain falls on my windows", zh: "窗外雨声 淅淅沥沥" }, { time: 13.92, en: "And a coldness runs through my soul", zh: "一阵寒流 噬满我心" },
        { time: 17.17, en: "And the rain falls, oh, the rain falls", zh: "雨一直下个不停" }, { time: 20.42, en: "I don't want to be alone", zh: "我不想 孑然一身" },
        { time: 23.67, en: "I wish that I could Photoshop", zh: "只是想要 修复曾经" }, { time: 27.16, en: "All our bad memories", zh: "我们之间 糟糕回忆" }
      ]
    }
  ];

  // ---------- 播放器核心 ----------
  let currentTrack = 0;
  const audio = new Audio();
  audio.volume = 0.68;
  let isPlaying = false;

  // DOM 元素
  const playPauseBtn = document.getElementById('play-pause-btn');
  const progressBar = document.getElementById('progress');
  const songTitleSpan = document.getElementById('song-title');
  const songArtistSpan = document.getElementById('song-artist');
  const playlistSelect = document.getElementById('playlist-select');
  const lyricsPanel = document.getElementById('lyricsPanel');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');

  let currentLyricIndex = -1;
  let lyricUpdateTimer = null;

  // 构建下拉菜单
  function buildPlaylistUI() {
    playlistSelect.innerHTML = '';
    PLAYLIST_DATA.forEach((track, idx) => {
      const option = document.createElement('option');
      option.value = idx;
      option.textContent = `${track.title} — ${track.artist}`;
      playlistSelect.appendChild(option);
    });
  }

  // 根据当前时间更新歌词（优雅同步）
  function updateLyricsDisplay() {
    const track = PLAYLIST_DATA[currentTrack];
    if (!track.lyrics || track.lyrics.length === 0) {
      lyricsPanel.innerHTML = `<div class="lyric-line-main"><div class="lyric-en-main">♪ ${track.title} ♪</div><div class="lyric-zh-main">纯粹氛围音轨 · 闭上眼睛感受旧网页的呼吸</div></div>`;
      return;
    }

    const currentTime = audio.currentTime;
    let activeIndex = -1;
    // 从后往前找最新的时间点歌词
    for (let i = track.lyrics.length - 1; i >= 0; i--) {
      if (currentTime >= track.lyrics[i].time) {
        activeIndex = i;
        break;
      }
    }

    if (activeIndex === currentLyricIndex) return;

    currentLyricIndex = activeIndex;
    if (activeIndex === -1) {
      // 没匹配到歌词时展示默认
      if (track.lyrics.length) {
        lyricsPanel.innerHTML = `<div class="lyric-line-main"><div class="lyric-en-main">♪ ${track.title}</div><div class="lyric-zh-main">即将响起 · 静心等候</div></div>`;
      }
      return;
    }

    const lyric = track.lyrics[activeIndex];
    let zhHtml = lyric.zh ? `<div class="lyric-zh-main">${lyric.zh}</div>` : '';
    lyricsPanel.innerHTML = `<div class="lyric-line-main"><div class="lyric-en-main">${lyric.en}</div>${zhHtml}</div>`;
  }

  // 加载指定歌曲
  function loadTrack(index) {
    currentTrack = index;
    const track = PLAYLIST_DATA[currentTrack];
    audio.src = track.src;
    songTitleSpan.textContent = track.title;
    songArtistSpan.textContent = track.artist;
    playlistSelect.value = currentTrack;
    // 重置歌词索引，强制刷新
    currentLyricIndex = -1;
    updateLyricsDisplay();

    // 重置进度条
    if (audio.duration) progressBar.value = 0;
    else progressBar.value = 0;

    if (isPlaying) {
      audio.play().catch(e => {
        // 自动播放策略: 静默失败, 但保留播放按钮状态不变, 用户交互后自动恢复
        if (e.name !== 'AbortError') console.log("需要用户交互才可自动播放");
        isPlaying = false;
        playPauseBtn.textContent = '▶';
      });
    }
  }

  // 播放/暂停切换
  function togglePlay() {
    if (audio.paused) {
      audio.play().then(() => {
        isPlaying = true;
        playPauseBtn.textContent = '❚❚';
      }).catch(e => {
        // 浏览器阻止自动播放时，保持暂停状态但提醒？
        alert("点击播放器任意控制按钮后即可播放～ 需要与页面交互一次 ♡");
        isPlaying = false;
        playPauseBtn.textContent = '▶';
      });
    } else {
      audio.pause();
      isPlaying = false;
      playPauseBtn.textContent = '▶';
    }
  }

  // 下一首
  function nextTrack() {
    currentTrack = (currentTrack + 1) % PLAYLIST_DATA.length;
    loadTrack(currentTrack);
    if (isPlaying) {
      audio.play().catch(e => console.log("自动播放受限"));
      playPauseBtn.textContent = '❚❚';
    } else {
      playPauseBtn.textContent = '▶';
    }
  }

  // 上一首
  function prevTrack() {
    currentTrack = (currentTrack - 1 + PLAYLIST_DATA.length) % PLAYLIST_DATA.length;
    loadTrack(currentTrack);
    if (isPlaying) {
      audio.play().catch(e => console.log("自动播放受限"));
      playPauseBtn.textContent = '❚❚';
    } else {
      playPauseBtn.textContent = '▶';
    }
  }

  // 进度条监听
  function handleProgressUpdate() {
    if (audio.duration && !isNaN(audio.duration)) {
      const percent = (audio.currentTime / audio.duration) * 100;
      progressBar.value = percent;
    }
    updateLyricsDisplay();
  }

  function setProgress(e) {
    if (audio.duration && !isNaN(audio.duration)) {
      const newTime = (progressBar.value / 100) * audio.duration;
      audio.currentTime = newTime;
      updateLyricsDisplay();
    }
  }

  // 歌曲结束时自动下一首
  function onTrackEnd() {
    nextTrack();
  }

  // 事件绑定 + 初始化
  function initPlayer() {
    buildPlaylistUI();
    loadTrack(0);

    playPauseBtn.addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', prevTrack);
    nextBtn.addEventListener('click', nextTrack);
    progressBar.addEventListener('input', setProgress);
    audio.addEventListener('timeupdate', handleProgressUpdate);
    audio.addEventListener('ended', onTrackEnd);
    playlistSelect.addEventListener('change', (e) => {
      const idx = parseInt(e.target.value, 10);
      if (!isNaN(idx) && idx !== currentTrack) {
        currentTrack = idx;
        loadTrack(currentTrack);
        if (isPlaying) {
          audio.play().catch(e => console.log("交互后自动恢复播放"));
          playPauseBtn.textContent = '❚❚';
        } else {
          playPauseBtn.textContent = '▶';
        }
      }
    });

    // 额外优雅处理：当音频就绪后如果处于播放状态且duration变动，更新进度
    audio.addEventListener('loadedmetadata', () => {
      if (isPlaying && audio.paused === false) {
        // nothing else
      }
      handleProgressUpdate();
    });

    // 提供给父页面通信的可选功能：不做强制，但保证模块自包含并完美运行
  }

  // 防止iframe 内音频因 src 跨域/加载错误时友好静默
  audio.addEventListener('error', (e) => {
    console.warn("音频加载失败，可能链接失效，请检查仓库文件路径:", audio.src);
    lyricsPanel.innerHTML = `<div class="lyric-line-main"><div class="lyric-en-main">🎵 音轨加载中 🎵</div><div class="lyric-zh-main">或许需要检查远程文件 || 但电台仍在等你</div></div>`;
  });

  initPlayer();
</script>
</body>
</html>
